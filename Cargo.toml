[workspace]
resolver = "3"
members = ["crates/*"]

# The version lives here and only here. scripts/update-version.ps1 moves it;
# never edit it by hand (docs/09-ci-cd-and-releases.md, ADR-001).
[workspace.package]
version = "0.9.0"
edition = "2024"
# 1.85 is edition 2024's floor, but the versions that carry security fixes we
# need are above it and the MSRV follows them rather than the other way round:
# `time` 0.3.47 (RUSTSEC-2026-0009, through tracing-appender) needs 1.88, and
# `rusqlite` 0.41 - the first to bundle SQLite 3.54, which fixes
# RUSTSEC-2026-0459 - needs 1.89. Claiming a floor we do not build on would be
# a false promise.
rust-version = "1.89"
license = "MIT"
repository = "https://git.zacx.net/owner/omni-toaster"
authors = ["owner <owner@zacx.net>"]
# Nothing here goes to crates.io: these are internal members of one
# application, and the deliverable is OmniToaster.exe. Saying so stops an
# accidental `cargo publish` and lets `cargo deny` accept versionless path
# dependencies between them.
publish = false

# Shared dependency versions. Each item adds what it needs here with
# `cargo add`, so the versions come from the registry rather than from memory,
# and a member then declares `<crate>.workspace = true`.
[workspace.dependencies]
# Library errors are typed with thiserror; the binary may use anyhow later
# (.claude/rules/rust.md).
thiserror = "2.0.21"

# Dates and times. Default features are off: chrono's `oldtime` and `wasmbind`
# pull in weight this project never uses, and `clock` is what gives local time.
# chrono-tz arrives with the prayer work, which needs Asia/Kuala_Lumpur.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# Structured logging with daily rotation.
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

# Localization (ADR-006). rust-embed keeps the bundled .ftl files inside the
# exe while user overrides are read from the data folder; the filesystem-assets
# feature is what layers one over the other.
fluent-bundle = "0.16.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "filesystem-assets"] }
rust-embed = "8.13.0"
unic-langid = "0.9.6"
fluent-syntax = "0.12.0"

# Storage (ADR-007). `bundled` compiles SQLite from source so the portable exe
# carries its own engine and cannot meet a missing or old system sqlite3.dll.
rusqlite = { version = "0.41.1", features = ["bundled"] }

# Embeds the icon and the version metadata into OmniToaster.exe at build time.
winresource = "0.1.34"

# The UI (ADR-003). eframe arrives with the settings window; egui alone is
# enough for the theme.
#
# `default_fonts` is off (ADR-014): it bundles the Ubuntu font, whose licence
# is not on the allow list, and OmniToaster draws with the Windows UI font
# instead. The settings window loads that font itself.
egui = { version = "0.33.3", default-features = false }
# `glow` is the renderer; `accesskit` is what gives the settings window to a
# screen reader, and it is an egui default we deliberately keep. `persistence`
# stays off: window geometry is ours to store under OmniToasterData/, not
# eframe's to put wherever it likes (ADR-004).
eframe = { version = "0.33.3", default-features = false, features = [
    "glow",
    "accesskit",
] }

# The tray icon and its menu (FEAT-0015). `gtk` and `libxdo` are Linux-only
# default features; this is a Windows tray, and dropping them keeps the Linux
# clippy run from wanting system libraries it has no business needing. `muda`
# arrives through tray-icon and is used through `tray_icon::menu`, so the two
# cannot drift apart.
tray-icon = { version = "0.24.2", default-features = false }

# `config/settings.toml` is the source of truth for configuration (ADR-007).
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }

# Decoding an imported image (FEAT-0021). Default features are off and only
# the three formats the spec allows are on - PNG, JPEG and WebP - so the exe
# carries no decoder for a format the app refuses anyway, and the attack
# surface is the three we validate rather than the twenty the crate can read.
# Pure Rust, so `+crt-static` and the portable build are unaffected.
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }

# Content-hashed asset names (docs/05-data-model-and-storage.md).
sha2 = "0.11.1"
# The window handle eframe hands over, for the title bar (CR-0002). Already in
# the tree through eframe and winit; named here so the version is one.
raw-window-handle = "0.6.2"

# Test-only.
tempfile = "3.27.0"
# Headless layout tests of the real UI (FEAT-0024). Default features off: no
# `wgpu`, no `snapshot`, so no GPU is needed and none is pulled in - the owner
# chose layout tests over pixel snapshots.
egui_kittest = { version = "0.33.3", default-features = false }

[workspace.lints.rust]
# A crate-wide allow is forbidden by the project rules, so lints that must hold
# everywhere are set here and each crate opts in with `[lints] workspace = true`.
unsafe_code = "warn"

[workspace.lints.clippy]
# The gate runs clippy with -D warnings, so these are errors in practice.
# unwrap/expect outside tests are a review item in .claude/rules/rust.md; these
# catch the cases a human reviewer misses.
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
# A portable single exe: strip symbols, one codegen unit, abort on panic in the
# worker so the supervisor sees a non-zero exit rather than a half-unwound
# process (docs/specs/supervisor.md).
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
# Pinned here rather than passed on the command line: setting
# CARGO_PROFILE_DEV_DEBUG on the command line changes every fingerprint and
# rebuilds the workspace (docs/GOTCHAS.md).
debug = 1
