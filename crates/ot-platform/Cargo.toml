[package]
name = "ot-platform"
description = "Every Windows API call, behind interfaces named for the capability."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
egui.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Devices_Display", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

# The tray is Windows-only, so the crate that draws it is too: this keeps the
# Linux clippy run from pulling gtk and libxdo for a tray it never builds.
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
